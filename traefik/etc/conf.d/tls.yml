tls:
  certificates:
    - certFile: /etc/letsencrypt/live/{{ env "FQDN" }}/fullchain.pem
      keyFile: /etc/letsencrypt/live/{{ env "FQDN" }}/privkey.pem
  stores:
    default:
      defaultCertificate:
        certFile: /etc/letsencrypt/live/{{ env "FQDN" }}/fullchain.pem
        keyFile: /etc/letsencrypt/live/{{ env "FQDN" }}/privkey.pem

