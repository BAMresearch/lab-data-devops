api:
  dashboard: false
  insecure: false

entryPoints:
  web:
    # Keep Traefik fully rootless on unprivileged ports
    # use firewall forwarding rules to point at the priv. ports
    address: ":80"
    http:
      # Drop request headers whose names alias managed headers (e.g. X_Auth_User for X-Auth-User)
      aliasHeadersStrategy: delete
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    transport:
      respondingTimeouts:
        # Traefik v3 default is 60s, which aborts large browser uploads
        readTimeout: 3600s
    http:
      aliasHeadersStrategy: delete
      tls:
        options: default

providers:
  file:
    directory: /etc/traefik/conf.d
    watch: true

log:
  level: INFO
